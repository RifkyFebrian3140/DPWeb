```html
<form>
    <p>
        <label for="nama">Nama Peminjam</label><br>
        <input type="text" id="nama" name="nama" required>
    </p>

    <p>
        <label for="no_anggota">No. Peminjam</label><br>
        <input type="text" id="no_anggota" name="no_anggota"
               placeholder="Contoh: P004" required>
    </p>

    <p>
        <label for="alamat">Alamat</label><br>
        <input type="text" id="alamat" name="alamat" required>
    </p>

    <p>
        <label for="no_hp">No. HP</label><br>
        <input type="tel" id="no_hp" name="no_hp"
               placeholder="Contoh: 081234567890" required>
    </p>

    <p>
        <label for="email">Email</label><br>
        <input type="email" id="email" name="email">
    </p>

    <p>
        <label for="alat">Alat Kemah yang Dipinjam</label><br>
        <select id="alat" name="alat" required>
            <option value="">Pilih alat kemah</option>
            <option value="Tenda">Tenda</option>
            <option value="Sleeping Bag">Sleeping Bag</option>
            <option value="Kompor Portable">Kompor Portable</option>
            <option value="Lampu Camping">Lampu Camping</option>
            <option value="Matras">Matras</option>
        </select>
    </p>

    <p>
        <label for="tanggal">Tanggal Meminjam</label><br>
        <input type="date" id="tanggal" name="tanggal" required>
    </p>

    <p>
        <button type="submit">Simpan</button>
        <button type="reset">Reset</button>
    </p>
</form>
```
