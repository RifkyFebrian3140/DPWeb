<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Peminjam - Camp Gear</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../assets/js/app.js" defer></script>
</head>
<body>
    <header>
        <a href="../index.html" class="logo">CAMP <span>GEAR</span></a>

        <button type="button" class="nav-toggle-label"
                aria-label="Buka atau tutup menu" aria-expanded="false">
            ☰ Menu
        </button>

        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="../alatkemah/list.html">Data Alat Kemah</a></li>
                <li><a href="list.html" class="active">Data Peminjam</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="page-heading">
            <p class="eyebrow">MANAJEMEN ANGGOTA</p>
            <h1>Tambah Peminjam</h1>
            <p>Isi informasi anggota pada formulir berikut.</p>
        </section>

        <section class="panel form-panel">
            <h2>Informasi Peminjam</h2>

            <form class="data-form">
                <div class="form-group">
                    <label for="nama">Nama Lengkap</label>
                    <input type="text" id="nama" name="nama"
                           placeholder="Masukkan nama lengkap" required>
                </div>

                <div class="form-group">
                    <label for="nomor_identitas">Nomor Identitas</label>
                    <input type="text" id="nomor_identitas" name="nomor_identitas"
                           placeholder="Contoh: AG004" required>
                </div>

                <div class="form-group">
                    <label for="telepon">Nomor Telepon</label>
                    <input type="tel" id="telepon" name="telepon"
                           placeholder="Masukkan nomor telepon" required>
                </div>

                <div class="form-group">
                    <label for="alamat">Alamat</label>
                    <textarea id="alamat" name="alamat" rows="4"
                              placeholder="Masukkan alamat" required></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Simpan Data</button>
                    <a href="list.html" class="btn btn-secondary">Batal</a>
                </div>
            </form>

            <p class="helper-text">Form ini hanya melakukan validasi di browser, belum menyimpan data.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Camp Gear. Sistem Pengelolaan Alat Kemah.</p>
    </footer>
</body>
</html>
